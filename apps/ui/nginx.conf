server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  # Proxy da API do LoginHUB no mesmo host do painel.
  #
  # Isto existe para que o browser tenha um caminho publico para a API sem
  # depender de um hostname dedicado no Cloudflare. A API monta tudo sob
  # /api (app.use('/api', router) em apps/api/src/app.ts), entao o prefixo
  # /api precisa ser PRESERVADO no upstream -- por isso o $request_uri
  # explicito, e nunca uma barra final no proxy_pass.
  #
  # '^~' impede que o location regex de assets estaticos abaixo roube
  # requisicoes de API terminadas em .js/.css.
  # O resolver do Docker (127.0.0.11) com upstream em variavel evita que o
  # nginx se recuse a subir caso o backend ainda nao esteja no ar.
  location ^~ /api {
    resolver 127.0.0.11 valid=30s;
    set $loginhub_api http://server_loginhub_backend:3000;
    proxy_pass $loginhub_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A API aceita JSON de ate 5mb (express.json); folga para o nginx nao
    # cortar a requisicao antes do express poder responder o erro.
    client_max_body_size 10m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public";
  }
}
