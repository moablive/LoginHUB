services:
  login-hub-ui:
    container_name: server_loginhub_frontend
    build:
      context: ../../
      dockerfile: apps/ui/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_MASTER_KEY: ${VITE_MASTER_KEY}
    
    env_file:
      - ../../.env

    restart: always

    ports:
      - "3006:80"

    networks:
      - awl_network

networks:
  awl_network:
    external: true
