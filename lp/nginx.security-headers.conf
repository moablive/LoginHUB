# Cabeçalhos de segurança da LP.
#
# Existe como arquivo separado por uma regra do nginx que morde: `add_header`
# NÃO é herdado por um `location` que tenha o seu próprio `add_header`. Como
# todos os locations daqui definem `Cache-Control`, deixar estas linhas só no
# bloco `server` faria a página ir para o ar sem CSP nenhuma. Então cada
# location dá `include` neste arquivo.
#
# A CSP libera apenas o que a página realmente usa: Google Fonts, e nada mais.
# Ao ligar o VITE_PLAUSIBLE_HOST, o host precisa entrar em `script-src` e
# `connect-src` — senão o navegador bloqueia e o painel fica vazio.
add_header X-Content-Type-Options  "nosniff" always;
add_header X-Frame-Options         "DENY" always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
add_header Permissions-Policy      "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
