# LoginHUB — página de venda (assinatura mensal). Container server_loginhub_lp (lp/ do monorepo LoginHUB).
#
# Mora no MESMO host do hub: loginhub.astralwavelabel.com/ (home) e /assine/. O nginx do hub
# (apps/ui/nginx.conf) repassa `/` (exato) e `/assine/` para este container; a venda usa o
# /api/venda do próprio hub (mesma origem: CSP `connect-src 'self'` sem CORS).


server {
    listen 80 default_server;

    # O nginx:alpine não conhece .webmanifest — sem isto o arquivo sai como
    # application/octet-stream e o Chrome ignora o manifesto do PWA.
    types {
        application/manifest+json  webmanifest;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # gzip: o bundle é 1 arquivo JS + 1 CSS; comprimir é o ganho barato de LCP.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      application/manifest+json;

    # Tudo vive sob /assine/ (o hub repassa o caminho sem reescrever). O `rewrite ... break` tira o
    # prefixo para achar o arquivo em /usr/share/nginx/html; `/index.html` tem location próprio
    # porque o fallback do `try_files` é um redirect interno e cairia no `location /` abaixo.
    location = /assine { return 301 /assine/; }

    # Bundles com hash no nome: podem ficar para sempre na borda.
    location ^~ /assine/assets/ {
        rewrite    ^/assine/(.*)$ /$1 break;
        root       /usr/share/nginx/html;
        include    /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /assine/A-LOGOS/ {
        rewrite    ^/assine/(.*)$ /$1 break;
        root       /usr/share/nginx/html;
        include    /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /index.html {
        root       /usr/share/nginx/html;
        include    /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA de página única — o index.html sempre revalida: é ele que aponta para os bundles
    # novos depois de um deploy. `/assine/obrigado` (volta do Mercado Pago) cai aqui também.
    location ^~ /assine/ {
        rewrite    ^/assine/(.*)$ /$1 break;
        root       /usr/share/nginx/html;
        try_files  $uri /index.html;
        include    /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 301 /assine/;
    }
}
